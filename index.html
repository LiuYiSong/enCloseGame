<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anfengqi.cn</title>
  <meta name="description" content="Games from anfengqi.cn." />
  <link rel="icon" href="/loopmakes/icon-256.png" type="image/png" />
  <link rel="apple-touch-icon" href="/loopmakes/icon-256.png" />
  <style>
    :root {
      --bg: #0c0612;
      --fg: #f4eef8;
      --muted: #b9a8c8;
      --line: rgba(244, 238, 248, 0.16);
      --accent: #e8c4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #3a1450 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2a4a 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      line-height: 1.65;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 22px 80px;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: 0.02em;
      margin: 0 0 8px;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.08rem;
      margin: 0 0 36px;
    }
    .game {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    .game:hover .name { color: var(--accent); }
    .icon {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 23.5%;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.38);
    }
    .icon img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .name {
      display: block;
      font-size: 1.2rem;
    }
    .blurb {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
    }
    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>anfengqi.cn</h1>
    <p class="tagline">Games</p>
    <a class="game" href="/loopmakes/">
      <span class="icon">
        <img src="/loopmakes/icon-256.png" width="64" height="64" alt="Loop Makes icon" />
      </span>
      <span>
        <span class="name">Loop Makes</span>
        <span class="blurb">Weave. Loop. Destroy.</span>
      </span>
    </a>
    <footer>
      <a href="mailto:enclosegame@outlook.com">enclosegame@outlook.com</a>
    </footer>
  </main>
</body>
</html>
